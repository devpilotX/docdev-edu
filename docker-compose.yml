services:
  postgres:
    image: postgres:16-alpine
    container_name: docdev-edu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docdev
      POSTGRES_PASSWORD: docdev
      POSTGRES_DB: docdev_edu
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docdev -d docdev_edu"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
